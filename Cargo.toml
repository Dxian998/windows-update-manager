[package]
name = "windows-update-manager"
version = "0.2.0"
edition = "2024"
authors = ["Sovereign"]

[dependencies]
colored = "3.0.0"
crossterm = "0.29.0"
tui = "0.19.0"
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Security_Authorization",   # SetNamedSecurityInfoW, SetEntriesInAclW, SE_REGISTRY_KEY
    "Win32_System_Registry",          # REG_OPTION_BACKUP_RESTORE, registry key flags
    "Win32_System_Services",          # OpenSCManager, ChangeServiceConfigW, ControlService
    "Win32_System_Com",               # CoInitializeEx, CoCreateInstance
    "Win32_System_TaskScheduler",     # ITaskService, ITaskFolder, IRegisteredTask
    "Win32_System_Variant",           # VARIANT (for ITaskService::Connect parameters)
    "Win32_System_Ole",               # Enables VARIANT definition and ITaskService::Connect
] }
winreg = "0.55.0"
open = "5.3.2"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"
